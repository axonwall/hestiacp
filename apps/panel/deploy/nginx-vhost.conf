# HestiaCP (Next.js panel) — cutover vhost for Hestia's own nginx.
#
# This REPLACES the `server { ... }` block in src/deb/nginx/nginx.conf
# (the http-level maps above it stay untouched). Differences from the
# PHP vhost, and why:
#
#   * `location /` proxies to the Next.js standalone server
#     (127.0.0.1:8093, hestiang-panel.service) instead of serving the
#     PHP tree. The legacy /api endpoint, logins, and every panel page
#     are the Next app's routes.
#   * The panel-wide `~ \.php$` handler is gone — PHP survives ONLY
#     inside /fm/ (FileGator), which keeps its alias + fastcgi block
#     verbatim. php-fpm therefore stays installed and running.
#   * The `/_shell/` proxy to the web terminal (localhost:8085) is
#     unchanged; the terminal authenticates off the same PHP-format
#     session files the Next panel writes.
#   * The WebApp installer-images location is dropped (those URLs
#     were PHP-tree paths; the Next catalog renders its own assets).
#   * The internal /backup/ and /rrd/ locations are dropped: the Next
#     panel streams backup downloads itself and renders RRD data from
#     v-list-sys-rrd JSON, so nothing issues X-Accel-Redirect anymore.
#   * root stays /usr/local/hestia/web so the static error pages keep
#     resolving during coexistence; nothing else is served from it.
#
# Rollback is restoring the original server block and reloading —
# the PHP tree is never modified by the cutover.

server {
	listen              8083 ssl;
	listen              [::]:8083 ssl;
	server_name         _;
	root                /usr/local/hestia/web;

	error_page          497 https://$host:$server_port$request_uri;
	error_page          403 /error/404.html;
	error_page          404 /error/404.html;
	error_page          410 /error/410.html;
	error_page          500 501 502 503 504 505 /error/50x.html;

	ssl_certificate     /usr/local/hestia/ssl/certificate.crt;
	ssl_certificate_key /usr/local/hestia/ssl/certificate.key;

	# TLS 1.3 0-RTT anti-replay (maps live at http level, unchanged)
	if ($anti_replay = 307) { return 307 https://$host:$server_port$request_uri; }
	if ($anti_replay = 425) { return 425; }

	# Deny access to sensitive file types in anything file-served
	location ~* \.(map|log|sh|sql|bak|env)$ {
		return 404;
	}

	location /error/ {
		expires off;
		internal;
	}

	# FileGator — still the PHP app, unchanged from the PHP vhost.
	location /fm/ {
		alias /usr/local/hestia/web/fm/dist/;
		index index.php;

		location ~ /([^/]+\.php)$ {
			try_files     /$1 =404;
			include       fastcgi_params;
			fastcgi_param HTTP_EARLY_DATA $rfc_early_data if_not_empty;
			fastcgi_param SCRIPT_FILENAME /usr/local/hestia/web/fm/dist/index.php;
			fastcgi_pass  unix:/run/hestia-php.sock;
			fastcgi_index index.php;
		}
	}

	# Web terminal — unchanged proxy to the terminal service.
	location /_shell/ {
		proxy_pass http://localhost:8085;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "Upgrade";
		proxy_set_header X-Real-IP $remote_addr;
	}

	# The legacy API lives at /api and — literally — /api/index.php
	# (upstream's api.bats and existing clients post to the .php
	# path). Both must reach the Next panel BEFORE the .php rule
	# below; on the first live flip every API call 404'd on Hestia's
	# error page because the regex location won over location /.
	location = /api {
		proxy_pass http://127.0.0.1:8093;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Host $host;
		proxy_set_header X-Forwarded-Proto https;
		client_max_body_size 32m;
		proxy_read_timeout 60s;
	}

	# Hestia's own remote-API client (func/remote.sh — DNS cluster
	# sync) posts to /api/ WITH a trailing slash, which PHP served
	# via the directory index. Next would 308-redirect it and curl
	# does not follow redirects, so rewrite to /api exactly.
	location = /api/ {
		proxy_pass http://127.0.0.1:8093/api;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Host $host;
		proxy_set_header X-Forwarded-Proto https;
		client_max_body_size 32m;
		proxy_read_timeout 60s;
	}

	location = /api/index.php {
		proxy_pass http://127.0.0.1:8093;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Host $host;
		proxy_set_header X-Forwarded-Proto https;
		client_max_body_size 32m;
		proxy_read_timeout 60s;
	}

	# No PHP outside FileGator anymore.
	location ~ \.php$ {
		return 404;
	}

	# The Next.js panel.
	location / {
		proxy_pass http://127.0.0.1:8093;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Host $host;
		proxy_set_header X-Forwarded-Proto https;
		# Panel forms are small (certs, configs); FileGator handles
		# large uploads itself under /fm/.
		client_max_body_size 32m;
		# WebApp installs run as background jobs, so no long proxy
		# timeouts are needed; keep reads snappy.
		proxy_read_timeout 60s;
	}
}
